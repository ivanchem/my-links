const MODULES=[{"slug": "market", "title": "Модуль 1 — Как устроен рынок", "content": "# Модуль 1 — Как устроен рынок\n\nПервый содержательный модуль LedgerLab Sales Academy. Материал основан на внутренних коммерческих и продуктовых документах LedgerLab.\n\n# Результат модуля\n\nПосле прохождения продавец должен уметь объяснить, где LedgerLab находится в цепочке рынка цифровых активов, какие типы участников для нас коммерчески интересны, какие классы задач мы решаем и почему нельзя начинать продажу с перечисления функций продукта.\n\n# Урок 1.1. Что продаёт LedgerLab\n\n## Главная мысль\n\nLedgerLab продаёт B2B-программную инфраструктуру: лицензии, on-premise / white-label решения, интеграции, внедрение и сопровождение.  \nBitBanker может использоваться как действующий кейс и подтверждение технологической зрелости, но продавец LedgerLab не продаёт клиенту сервис BitBanker как основной предмет сделки.  \nПродавец должен мыслить не функциями интерфейса, а бизнес-задачей клиента: что клиент хочет запустить, заменить, автоматизировать или взять под контроль.\n\n## Что продавец должен уметь\n\nОбъяснить LedgerLab одной фразой: поставщик программной инфраструктуры для участников рынка цифровых активов.  \nОтделить продажу ПО от продажи криптовалюты, ликвидности или юридического допуска.  \nПонять, когда клиенту нужен существующий продукт, а когда перед нами новая коммерчески значимая задача.\n\n# Урок 1.2. С какими участниками рынка мы работаем\n\n## Банк\n\nВнутренние материалы подтверждают банковские сценарии для STRATO.Exchange и STRATO.Custody. Банк может строить клиентский продукт с цифровыми активами, сохраняя ДБО, KYC/AML, АБС, IAM/SIEM и регулируемые решения в своём контуре. LedgerLab поставляет программный слой и интеграции, но не подменяет банк как оператора и ответственную регулируемую сторону.\n\n## Криптообменник / обменный сервис\n\nДля обменника LedgerLab может давать white-label платформу: витрину, кабинет клиента, операционную панель, ядро котировок и заявок, интеграции, учёт и сверки. Коммерческий интерес возникает, когда своё или текущее решение дорого поддерживать, мешает росту или его нужно быстро заменить/запустить.\n\n## OTC\n\nOTC указан как один из приоритетных сегментов продаж. Внутренние документы подтверждают сам сегмент, но не задают единую универсальную операционную модель OTC. Поэтому продавец сначала выясняет, как конкретный клиент управляет сделками, ликвидностью, кошельками и операционным контролем, и только после этого привязывает продукт.\n\n## Мастер-агенты и другие инфраструктурные участники\n\nЭти сегменты прямо названы среди целевых. Однако текущие материалы не дают единого формального определения мастер-агента для учебника. На этом этапе продавец должен знать сегмент и уметь выяснить фактическую роль компании: чьими активами она управляет, какие операции исполняет, где держит ликвидность, кто принимает решения и какое ПО использует.\n\n# Урок 1.3. Четыре типа задач, которые мы ищем\n\n## Exchange\n\nКлиенту нужно запустить или заменить ядро обмена цифровых активов: котировки, заявки, комиссии, лимиты, платежи, статусы, операционный кабинет, учёт и сверка.\n\n## Custody\n\nКлиенту нужно организовать хранение и операции с цифровыми активами: адреса, балансы, ключевой материал, MPC/TSS-подписание, роли, лимиты, approvals, консолидация и выводы.\n\n## Управление ликвидностью\n\nКлиент уже управляет существенными остатками на нескольких кошельках и/или биржах, а ручные перемещения, ребалансировка, доступы и сверки становятся дорогими и рискованными.\n\n## Новый продукт / заказная разработка\n\nЕсли у серьёзного клиента есть конкретная проблема, сроки, ЛПР и готовность инвестировать несколько миллионов рублей, это может быть коммерческая возможность LedgerLab даже при отсутствии готового продукта. Продавец не обещает решение заранее — он квалифицирует задачу и передаёт её на продуктовую и техническую оценку.\n\n# Урок 1.4. Как выглядит операция\n\n## Банковский сценарий\n\nВ подтверждённом банковском сценарии клиент действует в ДБО банка. Банк принимает юридически значимые решения, ведёт рублёвую часть и остаётся стороной клиентской сделки. STRATO.Exchange связывает котировку, заявку, RUB-платёж, исполнение через поставщика ликвидности и дальнейшее движение цифрового актива. STRATO.Custody может отвечать за кошельки и подписание в выбранном контуре.  \nВажно: это конкретный банковский сценарий, а не универсальная схема для всего крипторынка.\n\n## Сценарий обменника\n\nВ white-label обменнике клиент получает котировку, создаёт заявку и оплачивает её через согласованный платёжный контур. Платформа контролирует направление обмена, курс/маржу, резерв, лимиты, состояние заявки и исполнение. Конкретный эквайер, исполнитель выплаты, поддерживаемые сети и фактическая готовность отдельных функций зависят от согласованной поставки.\n\n# Урок 1.5. Где возникает потребность в LedgerLab\n\nПотребность обычно появляется не потому, что клиенту «нравится крипта», а потому что текущая инфраструктура становится ограничением.  \nТиповые сигналы:  \nсобственная разработка слишком дорогая или медленная;  \nнужно быстро запустить новый продукт;  \nсистемы и данные фрагментированы;  \nмного ручных операций и операторских ошибок;  \nрастут объёмы, кошельки, биржи и число участников процесса;  \nнужно разделить полномочия и усилить контроль;  \nбанк или другой крупный игрок хочет держать критический контур внутри собственной инфраструктуры;  \nсуществующий продукт не решает важную задачу, за которую клиент готов платить.\n\n# Мини-проверка\n\n1\\. Что является основным предметом продажи LedgerLab: сервис BitBanker, цифровая валюта или программная инфраструктура?  \nПравильный ориентир: программная инфраструктура.\n\n2\\. Можно ли считать любой OTC одинаковым клиентом и сразу показывать один и тот же продукт?  \nНет. Сегмент подтверждён как целевой, но сначала нужно понять фактическую операционную модель и проблему.\n\n3\\. Клиент говорит: «Нам интересна тема custody». Это уже коммерческая возможность?  \nНет. Пока неизвестны текущая ситуация, проблема, намерение решать, срок, ЛПР и бюджет.\n\n4\\. Компания управляет кошельками и биржами вручную, число операторов и переводов растёт. Какой класс задачи проверить первым?  \nУправление цифровой ликвидностью.\n\n# Источники и границы\n\nОсновные источники: «Требования к кандидату — Senior Business Development / Founding Sales LedgerLab», «Условия выплаты премии за SQL LedgerLab», «LedgerLab — STRATO.Exchange для банка», технический пакет Exchange, «LedgerLab — Кастодиан для банка», технический пакет Custody, «Ledger Lab — управление цифровой ликвидностью».  \nНе зафиксировано единое внутреннее определение мастер-агента и универсальная операционная модель OTC — эти места не должны тестироваться как точные определения до отдельного подтверждения.  \n", "html": "<h1>Модуль 1 — Как устроен рынок<\/h1>\n<p>Первый содержательный модуль LedgerLab Sales Academy. Материал основан на внутренних коммерческих и продуктовых документах LedgerLab.<\/p>\n<h1>Результат модуля<\/h1>\n<p>После прохождения продавец должен уметь объяснить, где LedgerLab находится в цепочке рынка цифровых активов, какие типы участников для нас коммерчески интересны, какие классы задач мы решаем и почему нельзя начинать продажу с перечисления функций продукта.<\/p>\n<h1>Урок 1.1. Что продаёт LedgerLab<\/h1>\n<h2>Главная мысль<\/h2>\n<p>LedgerLab продаёт B2B-программную инфраструктуру: лицензии, on-premise / white-label решения, интеграции, внедрение и сопровождение.  <\/p>\n<p>BitBanker может использоваться как действующий кейс и подтверждение технологической зрелости, но продавец LedgerLab не продаёт клиенту сервис BitBanker как основной предмет сделки.  <\/p>\n<p>Продавец должен мыслить не функциями интерфейса, а бизнес-задачей клиента: что клиент хочет запустить, заменить, автоматизировать или взять под контроль.<\/p>\n<h2>Что продавец должен уметь<\/h2>\n<p>Объяснить LedgerLab одной фразой: поставщик программной инфраструктуры для участников рынка цифровых активов.  <\/p>\n<p>Отделить продажу ПО от продажи криптовалюты, ликвидности или юридического допуска.  <\/p>\n<p>Понять, когда клиенту нужен существующий продукт, а когда перед нами новая коммерчески значимая задача.<\/p>\n<h1>Урок 1.2. С какими участниками рынка мы работаем<\/h1>\n<h2>Банк<\/h2>\n<p>Внутренние материалы подтверждают банковские сценарии для STRATO.Exchange и STRATO.Custody. Банк может строить клиентский продукт с цифровыми активами, сохраняя ДБО, KYC/AML, АБС, IAM/SIEM и регулируемые решения в своём контуре. LedgerLab поставляет программный слой и интеграции, но не подменяет банк как оператора и ответственную регулируемую сторону.<\/p>\n<h2>Криптообменник / обменный сервис<\/h2>\n<p>Для обменника LedgerLab может давать white-label платформу: витрину, кабинет клиента, операционную панель, ядро котировок и заявок, интеграции, учёт и сверки. Коммерческий интерес возникает, когда своё или текущее решение дорого поддерживать, мешает росту или его нужно быстро заменить/запустить.<\/p>\n<h2>OTC<\/h2>\n<p>OTC указан как один из приоритетных сегментов продаж. Внутренние документы подтверждают сам сегмент, но не задают единую универсальную операционную модель OTC. Поэтому продавец сначала выясняет, как конкретный клиент управляет сделками, ликвидностью, кошельками и операционным контролем, и только после этого привязывает продукт.<\/p>\n<h2>Мастер-агенты и другие инфраструктурные участники<\/h2>\n<p>Эти сегменты прямо названы среди целевых. Однако текущие материалы не дают единого формального определения мастер-агента для учебника. На этом этапе продавец должен знать сегмент и уметь выяснить фактическую роль компании: чьими активами она управляет, какие операции исполняет, где держит ликвидность, кто принимает решения и какое ПО использует.<\/p>\n<h1>Урок 1.3. Четыре типа задач, которые мы ищем<\/h1>\n<h2>Exchange<\/h2>\n<p>Клиенту нужно запустить или заменить ядро обмена цифровых активов: котировки, заявки, комиссии, лимиты, платежи, статусы, операционный кабинет, учёт и сверка.<\/p>\n<h2>Custody<\/h2>\n<p>Клиенту нужно организовать хранение и операции с цифровыми активами: адреса, балансы, ключевой материал, MPC/TSS-подписание, роли, лимиты, approvals, консолидация и выводы.<\/p>\n<h2>Управление ликвидностью<\/h2>\n<p>Клиент уже управляет существенными остатками на нескольких кошельках и/или биржах, а ручные перемещения, ребалансировка, доступы и сверки становятся дорогими и рискованными.<\/p>\n<h2>Новый продукт / заказная разработка<\/h2>\n<p>Если у серьёзного клиента есть конкретная проблема, сроки, ЛПР и готовность инвестировать несколько миллионов рублей, это может быть коммерческая возможность LedgerLab даже при отсутствии готового продукта. Продавец не обещает решение заранее — он квалифицирует задачу и передаёт её на продуктовую и техническую оценку.<\/p>\n<h1>Урок 1.4. Как выглядит операция<\/h1>\n<h2>Банковский сценарий<\/h2>\n<p>В подтверждённом банковском сценарии клиент действует в ДБО банка. Банк принимает юридически значимые решения, ведёт рублёвую часть и остаётся стороной клиентской сделки. STRATO.Exchange связывает котировку, заявку, RUB-платёж, исполнение через поставщика ликвидности и дальнейшее движение цифрового актива. STRATO.Custody может отвечать за кошельки и подписание в выбранном контуре.  <\/p>\n<p>Важно: это конкретный банковский сценарий, а не универсальная схема для всего крипторынка.<\/p>\n<h2>Сценарий обменника<\/h2>\n<p>В white-label обменнике клиент получает котировку, создаёт заявку и оплачивает её через согласованный платёжный контур. Платформа контролирует направление обмена, курс/маржу, резерв, лимиты, состояние заявки и исполнение. Конкретный эквайер, исполнитель выплаты, поддерживаемые сети и фактическая готовность отдельных функций зависят от согласованной поставки.<\/p>\n<h1>Урок 1.5. Где возникает потребность в LedgerLab<\/h1>\n<p>Потребность обычно появляется не потому, что клиенту «нравится крипта», а потому что текущая инфраструктура становится ограничением.  <\/p>\n<p>Типовые сигналы:  <\/p>\n<p>собственная разработка слишком дорогая или медленная;  <\/p>\n<p>нужно быстро запустить новый продукт;  <\/p>\n<p>системы и данные фрагментированы;  <\/p>\n<p>много ручных операций и операторских ошибок;  <\/p>\n<p>растут объёмы, кошельки, биржи и число участников процесса;  <\/p>\n<p>нужно разделить полномочия и усилить контроль;  <\/p>\n<p>банк или другой крупный игрок хочет держать критический контур внутри собственной инфраструктуры;  <\/p>\n<p>существующий продукт не решает важную задачу, за которую клиент готов платить.<\/p>\n<h1>Мини-проверка<\/h1>\n<p>1\\. Что является основным предметом продажи LedgerLab: сервис BitBanker, цифровая валюта или программная инфраструктура?  <\/p>\n<p>Правильный ориентир: программная инфраструктура.<\/p>\n<p>2\\. Можно ли считать любой OTC одинаковым клиентом и сразу показывать один и тот же продукт?  <\/p>\n<p>Нет. Сегмент подтверждён как целевой, но сначала нужно понять фактическую операционную модель и проблему.<\/p>\n<p>3\\. Клиент говорит: «Нам интересна тема custody». Это уже коммерческая возможность?  <\/p>\n<p>Нет. Пока неизвестны текущая ситуация, проблема, намерение решать, срок, ЛПР и бюджет.<\/p>\n<p>4\\. Компания управляет кошельками и биржами вручную, число операторов и переводов растёт. Какой класс задачи проверить первым?  <\/p>\n<p>Управление цифровой ликвидностью.<\/p>\n<h1>Источники и границы<\/h1>\n<p>Основные источники: «Требования к кандидату — Senior Business Development / Founding Sales LedgerLab», «Условия выплаты премии за SQL LedgerLab», «LedgerLab — STRATO.Exchange для банка», технический пакет Exchange, «LedgerLab — Кастодиан для банка», технический пакет Custody, «Ledger Lab — управление цифровой ликвидностью».  <\/p>\n<p>Не зафиксировано единое внутреннее определение мастер-агента и универсальная операционная модель OTC — эти места не должны тестироваться как точные определения до отдельного подтверждения.  <\/p>"}, {"slug": "client", "title": "Модуль 2 — Кто наш клиент", "content": "# Модуль 2 — Кто наш клиент\n\nЭтот модуль учит отличать «компания относится к нашему рынку» от «у нас есть реальная продажа».\n\n# Результат модуля\n\nПосле прохождения продавец должен уметь определить, стоит ли тратить время на конкретную компанию, какие признаки делают аккаунт сильным и почему даже очень крупная компания ещё не является SQL.\n\n# Урок 2.1. ICP и SQL — это не одно и то же\n\n## ICP\n\nICP — Ideal Customer Profile, профиль компании, которая потенциально подходит LedgerLab по типу бизнеса, масштабу и характеру инфраструктурной задачи.  \nICP отвечает на вопрос: «Стоит ли нам вообще пытаться открыть этот аккаунт?»\n\n## SQL\n\nSQL — Sales Qualified Lead, подтверждённая коммерческая потребность.  \nПо внутренним правилам LedgerLab SQL появляется только после выявления текущей ситуации, конкретной проблемы, потребности, намерения решать, срока, ЛПР, масштаба/бюджета и состоявшейся предметной встречи.  \nSQL отвечает на вопрос: «Есть ли здесь реальная продажа сейчас?»\n\nКрупный банк может быть отличным ICP и одновременно не быть SQL, если у него нет проекта, срока и бюджета.  \nНебольшой новый игрок может не иметь текущего оборота, но стать сильным SQL, если у него есть серьёзный проект, ЛПР, бюджет и намерение запускаться.\n\n# Урок 2.2. Приоритетные сегменты\n\n## Приоритет 1: крупные обменники и обменные сервисы\n\nВ требованиях к продавцу они стоят среди первых целевых сегментов. Сильный сигнал — существенный оборот, собственная технологическая инфраструктура и потребность улучшить или заменить её.\n\n## Приоритет 2: OTC и мастер-агенты\n\nЭти сегменты важны из\\-за сложной операционной инфраструктуры, работы с крупными сделками и возможной потребности в custody, ликвидности, контроле доступа и автоматизации. Конкретный продукт определяется только после discovery.\n\n## Приоритет 3: банки\n\nБанк становится целевым, когда реально рассматривает продукт или инфраструктуру цифровых активов: обмен в ДБО, custody, хранение собственных активов, клиентский цифровой депозитарный сценарий или иной конкретный проект.\n\n## Расширение: fintech / payments / другие инфраструктурные компании\n\nДопустимо, если есть собственная инфраструктурная задача цифровых активов/платежей и готовность инвестировать в программное решение.\n\n# Урок 2.3. Признаки сильного потенциального клиента\n\n## Масштаб\n\nДля действующих участников в правилах SQL указан ориентир: оборот от нескольких сотен тысяч USDT в день. Это ориентир, а не формальный порог.  \nВ другом внутреннем документе встречается ориентир 0,5 млн USDT/день. Для курса используем более осторожную формулировку «несколько сотен тысяч USDT/день — ориентир, не обязательный порог» до отдельного коммерческого решения.\n\n## Экономическая серьёзность\n\nКлиент понимает, что собственное инфраструктурное ПО стоит дорого, и готов обсуждать инвестиции в несколько миллионов рублей, включая сделки 10+ млн ₽.\n\n## Проблема\n\nЕсть конкретное неудобство или ограничение текущей схемы: дорого поддерживать, сложно масштабировать, много ручных операций, недостаточный контроль, нужно запустить новый продукт или заменить существующий.\n\n## Намерение\n\nКлиент действительно собирается решать задачу, а не просто изучает рынок.\n\n## Срок\n\nЕсть ориентир, когда решение должно быть принято или запущено.\n\n## ЛПР\n\nЕсть контакт с человеком, который принимает решение или существенно влияет на него.\n\n# Урок 2.4. Когда лид слабый\n\n## Плохие признаки\n\nКлиент «просто интересуется».  \nПросит прислать презентацию без обсуждения задачи.  \nНет конкретной проблемы.  \nНе собирается реально решать вопрос.  \nНет понимания бюджета.  \nНе готов инвестировать в собственную или внешнюю разработку.  \nНет доступа к человеку, влияющему на решение.  \nНе готов на предметную встречу.  \nПотребность не подтверждается после разговора.\n\nРазмер компании сам по себе не компенсирует эти недостатки.\n\n# Урок 2.5. Кто участвует в покупке\n\nДля сложной B2B / enterprise-сделки внутренние материалы перечисляют несколько центров влияния:  \nсобственник / CEO;  \nкоммерческий блок;  \nCTO / CIO;  \nинформационная безопасность;  \nюристы;  \nзакупки;  \nдругие участники в зависимости от проекта.  \nПродавец должен понимать карту решения и не считать один хороший контакт гарантией сделки.\n\n# Урок 2.6. Как быстро оценить аккаунт до контакта\n\nПеред выходом на компанию продавец формулирует гипотезу:  \n1\\. Какой это участник рынка?  \n2\\. Какой у него масштаб?  \n3\\. Что известно о его текущем продукте или инфраструктуре?  \n4\\. Какая из четырёх задач LedgerLab наиболее вероятна?  \n5\\. Кто может быть бизнес-ЛПР?  \n6\\. Кто будет техническим ЛПР?  \n7\\. Есть ли событие-триггер: запуск, рост, регулирование, замена системы, выход нового продукта?  \n8\\. Что мы хотим узнать на первом контакте, чтобы либо усилить, либо отвергнуть гипотезу?\n\n# Мини-проверка\n\n1\\. Компания — крупный банк, но нет утверждённого проекта цифровых активов. Это SQL?  \nНет. Это потенциально сильный ICP, но потребность ещё не подтверждена.\n\n2\\. Новый игрок пока не имеет оборота, но собственник планирует запуск, имеет бюджет 10 млн ₽, срок четыре месяца и согласен на предметную встречу. Может ли он быть интересен?  \nДа. Отсутствие текущего оборота не исключает серьёзного клиента.\n\n3\\. Клиент имеет оборот \\$1 млн в день, но говорит только «пришлите презентацию». Это SQL?  \nНет.\n\n4\\. Какой показатель важнее для SQL: формальный оборот или подтверждённая проблема \\+ намерение \\+ бюджет \\+ срок \\+ ЛПР?  \nВторое. Оборот используется как ориентир масштаба, но не заменяет квалификацию.\n\n# Источники и границы\n\nОсновные источники: «Условия выплаты премии за SQL LedgerLab», «Требования к кандидату — Senior Business Development / Founding Sales LedgerLab».  \nКонфликт по ориентиру оборота зафиксирован в карте знаний. В курс не вводится жёсткий минимальный порог до отдельного решения коммерческого владельца.  \n", "html": "<h1>Модуль 2 — Кто наш клиент<\/h1>\n<p>Этот модуль учит отличать «компания относится к нашему рынку» от «у нас есть реальная продажа».<\/p>\n<h1>Результат модуля<\/h1>\n<p>После прохождения продавец должен уметь определить, стоит ли тратить время на конкретную компанию, какие признаки делают аккаунт сильным и почему даже очень крупная компания ещё не является SQL.<\/p>\n<h1>Урок 2.1. ICP и SQL — это не одно и то же<\/h1>\n<h2>ICP<\/h2>\n<p>ICP — Ideal Customer Profile, профиль компании, которая потенциально подходит LedgerLab по типу бизнеса, масштабу и характеру инфраструктурной задачи.  <\/p>\n<p>ICP отвечает на вопрос: «Стоит ли нам вообще пытаться открыть этот аккаунт?»<\/p>\n<h2>SQL<\/h2>\n<p>SQL — Sales Qualified Lead, подтверждённая коммерческая потребность.  <\/p>\n<p>По внутренним правилам LedgerLab SQL появляется только после выявления текущей ситуации, конкретной проблемы, потребности, намерения решать, срока, ЛПР, масштаба/бюджета и состоявшейся предметной встречи.  <\/p>\n<p>SQL отвечает на вопрос: «Есть ли здесь реальная продажа сейчас?»<\/p>\n<p>Крупный банк может быть отличным ICP и одновременно не быть SQL, если у него нет проекта, срока и бюджета.  <\/p>\n<p>Небольшой новый игрок может не иметь текущего оборота, но стать сильным SQL, если у него есть серьёзный проект, ЛПР, бюджет и намерение запускаться.<\/p>\n<h1>Урок 2.2. Приоритетные сегменты<\/h1>\n<h2>Приоритет 1: крупные обменники и обменные сервисы<\/h2>\n<p>В требованиях к продавцу они стоят среди первых целевых сегментов. Сильный сигнал — существенный оборот, собственная технологическая инфраструктура и потребность улучшить или заменить её.<\/p>\n<h2>Приоритет 2: OTC и мастер-агенты<\/h2>\n<p>Эти сегменты важны из\\-за сложной операционной инфраструктуры, работы с крупными сделками и возможной потребности в custody, ликвидности, контроле доступа и автоматизации. Конкретный продукт определяется только после discovery.<\/p>\n<h2>Приоритет 3: банки<\/h2>\n<p>Банк становится целевым, когда реально рассматривает продукт или инфраструктуру цифровых активов: обмен в ДБО, custody, хранение собственных активов, клиентский цифровой депозитарный сценарий или иной конкретный проект.<\/p>\n<h2>Расширение: fintech / payments / другие инфраструктурные компании<\/h2>\n<p>Допустимо, если есть собственная инфраструктурная задача цифровых активов/платежей и готовность инвестировать в программное решение.<\/p>\n<h1>Урок 2.3. Признаки сильного потенциального клиента<\/h1>\n<h2>Масштаб<\/h2>\n<p>Для действующих участников в правилах SQL указан ориентир: оборот от нескольких сотен тысяч USDT в день. Это ориентир, а не формальный порог.  <\/p>\n<p>В другом внутреннем документе встречается ориентир 0,5 млн USDT/день. Для курса используем более осторожную формулировку «несколько сотен тысяч USDT/день — ориентир, не обязательный порог» до отдельного коммерческого решения.<\/p>\n<h2>Экономическая серьёзность<\/h2>\n<p>Клиент понимает, что собственное инфраструктурное ПО стоит дорого, и готов обсуждать инвестиции в несколько миллионов рублей, включая сделки 10+ млн ₽.<\/p>\n<h2>Проблема<\/h2>\n<p>Есть конкретное неудобство или ограничение текущей схемы: дорого поддерживать, сложно масштабировать, много ручных операций, недостаточный контроль, нужно запустить новый продукт или заменить существующий.<\/p>\n<h2>Намерение<\/h2>\n<p>Клиент действительно собирается решать задачу, а не просто изучает рынок.<\/p>\n<h2>Срок<\/h2>\n<p>Есть ориентир, когда решение должно быть принято или запущено.<\/p>\n<h2>ЛПР<\/h2>\n<p>Есть контакт с человеком, который принимает решение или существенно влияет на него.<\/p>\n<h1>Урок 2.4. Когда лид слабый<\/h1>\n<h2>Плохие признаки<\/h2>\n<p>Клиент «просто интересуется».  <\/p>\n<p>Просит прислать презентацию без обсуждения задачи.  <\/p>\n<p>Нет конкретной проблемы.  <\/p>\n<p>Не собирается реально решать вопрос.  <\/p>\n<p>Нет понимания бюджета.  <\/p>\n<p>Не готов инвестировать в собственную или внешнюю разработку.  <\/p>\n<p>Нет доступа к человеку, влияющему на решение.  <\/p> <p>Второе. Оборот используется как ориентир масштаба, но не заменяет квалификацию.<\/p>\n<h1>Источники и границы<\/h1>\n<p>Основные источники: «Условия выплаты премии за SQL LedgerLab», «Требования к кандидату — Senior Business Development / Founding Sales LedgerLab».  <\/p>\n<p>Конфликт по ориентиру оборота зафиксирован в карте знаний. В курс не вводится жёсткий минимальный порог до отдельного решения коммерческого владельца.  <\/p>"}, {"slug": "problem", "title": "Модуль 3 — Какую проблему мы ищем", "content": "# Модуль 3 — Какую проблему мы ищем\n\nГлавная задача продавца LedgerLab — обнаружить коммерчески значимый разрыв между тем, как клиент работает сейчас, и тем, как ему нужно работать.\n\n# Результат модуля\n\nПосле прохождения продавец должен уметь провести первичное discovery, отличить симптом от проблемы, связать проблему с продуктовым направлением и определить, достаточно ли данных для SQL.\n\n# Урок 3.1. Продавец ищет не продукт, а разрыв\n\n## Текущая ситуация\n\nСначала выясняем фактическую модель: как клиент работает сейчас, какие системы использует, где находятся активы, кто выполняет операции, что автоматизировано и что делается вручную.\n\n## Проблема\n\nПроблема — не «у нас нет LedgerLab». Это ограничение текущей схемы: она слишком дорогая, медленная, рискованная, ручная, плохо масштабируется, не даёт нужного контроля или не позволяет запустить новый бизнес-сценарий.\n\n## Потребность\n\nПотребность описывает результат: что клиент хочет изменить. Например, быстро запустить exchange-продукт, разделить полномочия при подписании, автоматизировать ребалансировку или заменить нестабильную самописную систему.\n\nПоследовательность важна:  \nкак сейчас → что не устраивает → какой эффект создаёт проблема → как должно быть → почему это надо решать сейчас.\n\n# Урок 3.2. Четыре семейства проблем\n\n## Exchange-проблема\n\nПризнаки:  \nнужно запустить или заменить обменный продукт;  \nсвоё ядро дорого или долго развивать;  \nтекущая платформа не даёт нужных интеграций, контроля заявок, котировок, лимитов или сверки;  \nнужно white-label / on-prem решение.\n\n## Custody-проблема\n\nПризнаки:  \nсущественные цифровые активы;  \nопасная зависимость от одного ключа или одного человека;  \nнужно разделение полномочий;  \nнужны MPC/TSS, лимиты, whitelist, approvals, восстановление;  \nбанк хочет держать ключевой и операционный контур у себя.\n\n## Liquidity-проблема\n\nПризнаки:  \nмного кошельков и бирж;  \nперемещения и ребалансировка выполняются вручную;  \nнесколько операторов имеют доступ;  \nнет единого обзора остатков и операций;  \nрастёт цена ошибки и время исполнения.\n\n## Новая продуктовая задача\n\nУ клиента есть реальная инфраструктурная проблема, которую текущие продукты не закрывают, но он готов за решение платить и у него есть срок и ЛПР.  \nЭто не повод пообещать разработку. Это повод квалифицировать возможность и передать её на оценку.\n\n# Урок 3.3. Покупательский триггер\n\nПроблема может существовать годами и не превращаться в сделку.  \nТриггер — событие, из\\-за которого клиент начинает действовать.  \nПодтверждённые внутренними материалами типы триггеров:  \nзапуск нового продукта;  \nвыход банка в цифровые активы;  \nрост объёма операций;  \nрост числа кошельков, бирж или операторов;  \nзамена устаревшей/дорогой внутренней системы;  \nпотребность в on-prem/private cloud;  \nнеобходимость усилить контроль и разделение полномочий;  \nпоявление конкретного срока и бюджета.  \nПродавец должен выяснить не только «болит ли», но и «почему решать сейчас».\n\n# Урок 3.4. Восемь обязательных элементов SQL\n\n## 1\\. Текущая ситуация\n\nКак клиент работает сейчас.\n\n## 2\\. Конкретная проблема\n\nЧто в текущей схеме не устраивает или ограничивает.\n\n## 3\\. Потребность\n\nКакую задачу клиент хочет решить и какой результат получить.\n\n## 4\\. Намерение решить\n\nКлиент реально собирается решать задачу — сам или с поставщиком.\n\n## 5\\. Срок\n\nЕсть ориентировочный срок решения.\n\n## 6\\. ЛПР\n\nЕсть контакт с человеком, который принимает решение или существенно влияет на него.\n\n## 7\\. Масштаб и бюджет\n\nКлиент понимает порядок стоимости и подтверждает готовность инвестировать несколько миллионов рублей.\n\n## 8\\. Встреча с LedgerLab\n\nПредметная встреча состоялась, и на ней критерии подтвердились.\n\nВажно: SQL — это качество выявленной возможности, а не факт передачи контакта.\n\n# Урок 3.5. Что не является SQL\n\nНе SQL:  \nинтерес к теме;  \nпросьба прислать презентацию;  \nназвание компании без контакта и задачи;  \nпотребность без намерения реально решать;  \nконтакт без ЛПР;  \nнепонимание бюджета;  \nотказ обсуждать сроки;  \nнесостоявшаяся встреча;  \nкрасивая продуктовая гипотеза, которую клиент сам не подтвердил.\n\n# Урок 3.6. Базовая последовательность discovery\n\n1\\. Расскажите, как этот процесс работает сейчас.  \n2\\. Какие системы и команды в нём участвуют?  \n3\\. Что в текущей схеме вас не устраивает?  \n4\\. К чему это приводит: стоимость, скорость, риск, ограничение роста?  \n5\\. Что вы хотите получить вместо этого?  \n6\\. Почему решили заниматься этим сейчас?  \n7\\. Какой срок?  \n8\\. Какие альтернативы рассматриваете: своё решение, другой поставщик, ничего не менять?  \n9\\. Кто принимает бизнес-решение?  \n10\\. Кто будет оценивать технологию, ИБ и юридическую модель?  \n11\\. Какой порядок инвестиций реалистичен?  \n12\\. Какой следующий конкретный шаг мы можем согласовать?\n\n# Урок 3.7. Когда подключать экспертов\n\nПродавец должен вести значительную часть discovery и базового технического пресейла самостоятельно.  \nCTO/CIO, архитектор, ИБ, юрист и другие эксперты подключаются, когда нужно:  \nподтвердить архитектуру;  \nоценить новую сеть/актив;  \nпроверить ИБ или криптографические требования;  \nдать обязательство по производительности/SLA/RPO/RTO;  \nоценить нестандартную интеграцию;  \nподтвердить регуляторную трактовку;  \nоценить заказную разработку.  \nПродавец не должен маскировать незнание обещанием.\n\n# Практические мини-кейсы\n\n## Кейс A\n\nОбменник обрабатывает около \\$700 тыс. в день, работает на собственной системе пятилетней давности. Четыре разработчика постоянно чинят интеграции, собственник хочет новый продукт через три месяца.  \nЧто уже известно: сильный ICP, возможная Exchange-проблема, есть триггер.  \nЧего не хватает до SQL: конкретный ЛПР/состав решения, подтверждённый бюджет, детальная проблема, желаемый результат и предметная встреча.\n\n## Кейс B\n\nOTC говорит: «Нам интересен MPC».  \nНельзя сразу продавать Custody.  \nСначала выясняем: какие активы хранят, где ключи, кто подписывает, есть ли клиентские активы, какие сети, какие лимиты и какой риск они хотят снизить.\n\n## Кейс C\n\nКомпания говорит: «У нас восемь кошельков, четыре биржи и три оператора. Каждый день вручную перебрасываем USDT».  \nЭто сильный сигнал Liquidity-проблемы.  \nСледующий шаг: измерить объём ручных операций, задержки/ошибки, правила доступа и выбрать один поток для пилотной гипотезы.\n\n# Источники и границы\n\nОсновной источник SQL: «Условия выплаты премии за SQL LedgerLab».  \nПродуктовые примеры: внутренние материалы Exchange, Custody и управления цифровой ликвидностью.  \nЕсли продуктовый scope не подтверждён, продавец формулирует гипотезу и инициирует проверку, а не обещает клиенту готовую функцию.  \n", "html": "<h1>Модуль 3 — Какую проблему мы ищем<\/h1>\n<p>Главная задача продавца LedgerLab — обнаружить коммерчески значимый разрыв между тем, как клиент работает сейчас, и тем, как ему нужно работать.<\/p>\n<h1>Результат модуля<\/h1>\n<p>После прохождения продавец должен уметь провести первичное discovery, отличить симптом от проблемы, связать проблему с продуктовым направлением и определить, достаточно ли данных для SQL.<\/p>\n<h1>Урок 3.1. Продавец ищет не продукт, а разрыв<\/h1>\n<h2>Текущая ситуация<\/h2>\n<p>Сначала выясняем фактическую модель: как клиент работает сейчас, какие системы использует, где находятся активы, кто выполняет операции, что автоматизировано и что
