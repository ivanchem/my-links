ер<\/h1>\n<p>Проблема может существовать годами и не превращаться в сделку.  <\/p>\n<p>Триггер — событие, из\\-за которого клиент начинает действовать.  <\/p>\n<p>Подтверждённые внутренними материалами типы триггеров:  <\/p>\n<p>запуск нового продукта;  <\/p>\n<p>выход банка в цифровые активы;  <\/p>\n<p>рост объёма операций;  <\/p>\n<p>рост числа кошельков, бирж или операторов;  <\/p>\n<p>замена устаревшей/дорогой внутренней системы;  <\/p>\n<p>потребность в on-prem/private cloud;  <\/p>\n<p>необходимость усилить контроль и разделение полномочий;  <\/p>\n<p>появление конкретного срока и бюджета.  <\/p>\n<p>Продавец должен выяснить не только «болит ли», но и «почему решать сейчас».<\/p>\n<h1>Урок 3.4. Восемь обязательных элементов SQL<\/h1>\n<h2>1\\. Текущая ситуация<\/h2>\n<p>Как клиент работает сейчас.<\/p>\n<h2>2\\. Конкретная проблема<\/h2>\n<p>Что в текущей схеме не устраивает или ограничивает.<\/p>\n<h2>3\\. Потребность<\/h2>\n<p>Какую задачу клиент хочет решить и какой результат получить.<\/p>\n<h2>4\\. Намерение решить<\/h2>\n<p>Клиент реально собирается решать задачу — сам или с поставщиком.<\/p>\n<h2>5\\. Срок<\/h2>\n<p>Есть ориентировочный срок решения.<\/p>\n<h2>6\\. ЛПР<\/h2>\n<p>Есть контакт с человеком, который принимает решение или существенно влияет на него.<\/p>\n<h2>7\\. Масштаб и бюджет<\/h2>\n<p>Клиент понимает порядок стоимости и подтверждает готовность инвестировать несколько миллионов рублей.<\/p>\n<h2>8\\. Встреча с LedgerLab<\/h2>\n<p>Предметная встреча состоялась, и на ней критерии подтвердились.<\/p>\n<p>Важно: SQL — это качество выявленной возможности, а не факт передачи контакта.<\/p>\n<h1>Урок 3.5. Что не является SQL<\/h1>\n<p>Не SQL:  <\/p>\n<p>интерес к теме;  <\/p>\n<p>просьба прислать презентацию;  <\/p>\n<p>название компании без контакта и задачи;  <\/p>\n<p>потребность без намерения реально решать;  <\/p>\n<p>контакт без ЛПР;  <\/p>\n<p>непонимание бюджета;  <\/p>\n<p>отказ обсуждать сроки;  <\/p>\n<p>несостоявшаяся встреча;  <\/p>\n<p>красивая продуктовая гипотеза, которую клиент сам не подтвердил.<\/p>\n<h1>Урок 3.6. Базовая последовательность discovery<\/h1>\n<p>1\\. Расскажите, как этот процесс работает сейчас.  <\/p>\n<p>2\\. Какие системы и команды в нём участвуют?  <\/p>\n<p>3\\. Что в текущей схеме вас не устраивает?  <\/p>\n<p>4\\. К чему это приводит: стоимость, скорость, риск, ограничение роста?  <\/p>\n<p>5\\. Что вы хотите получить вместо этого?  <\/p>\n<p>6\\. Почему решили заниматься этим сейчас?  <\/p>\n<p>7\\. Какой срок?  <\/p>\n<p>8\\. Какие альтернативы рассматриваете: своё решение, другой поставщик, ничего не менять?  <\/p>\n<p>9\\. Кто принимает бизнес-решение?  <\/p>\n<p>10\\. Кто будет оценивать технологию, ИБ и юридическую модель?  <\/p>\n<p>11\\. Какой порядок инвестиций реалистичен?  <\/p>\n<p>12\\. Какой следующий конкретный шаг мы можем согласовать?<\/p>\n<h1>Урок 3.7. Когда подключать экспертов<\/h1>\n<p>Продавец должен вести значительную часть discovery и базового технического пресейла самостоятельно.  <\/p>\n<p>CTO/CIO, архитектор, ИБ, юрист и другие эксперты подключаются, когда нужно:  <\/p>\n<p>подтвердить архитектуру;  <\/p>\n<p>оценить новую сеть/актив;  <\/p>\n<p>проверить ИБ или криптографические требования;  <\/p>\n<p>дать обязательство по производительности/SLA/RPO/RTO;  <\/p>\n<p>оценить нестандартную интеграцию;  <\/p>\n<p>подтвердить регуляторную трактовку;  <\/p>\n<p>оценить заказную разработку.  <\/p>\n<p>Продавец не должен маскировать незнание обещанием.<\/p>\n<h1>Практические мини-кейсы<\/h1>\n<h2>Кейс A<\/h2>\n<p>Обменник обрабатывает около \\$700 тыс. в день, работает на собственной системе пятилетней давности. Четыре разработчика постоянно чинят интеграции, собственник хочет новый продукт через три месяца.  <\/p>\n<p>Что уже известно: сильный ICP, возможная Exchange-проблема, есть триггер.  <\/p>\n<p>Чего не хватает до SQL: конкретный ЛПР/состав решения, подтверждённый бюджет, детальная проблема, желаемый результат и предметная встреча.<\/p>\n<h2>Кейс B<\/h2>\n<p>OTC говорит: «Нам интересен MPC».  <\/p>\n<p>Нельзя сразу продавать Custody.  <\/p>\n<p>Сначала выясняем: какие активы хранят, где ключи, кто подписывает, есть ли клиентские активы, какие сети, какие лимиты и какой риск они хотят снизить.<\/p>\n<h2>Кейс C<\/h2>\n<p>Компания говорит: «У нас восемь кошельков, четыре биржи и три оператора. Каждый день вручную перебрасываем USDT».  <\/p>\n<p>Это сильный сигнал Liquidity-проблемы.  <\/p>\n<p>Следующий шаг: измерить объём ручных операций, задержки/ошибки, правила доступа и выбрать один поток для пилотной гипотезы.<\/p>\n<h1>Источники и границы<\/h1>\n<p>Основной источник SQL: «Условия выплаты премии за SQL LedgerLab».  <\/p>\n<p>Продуктовые примеры: внутренние материалы Exchange, Custody и управления цифровой ликвидностью.  <\/p>\n<p>Если продуктовый scope не подтверждён, продавец формулирует гипотезу и инициирует проверку, а не обещает клиенту готовую функцию.  <\/p>"}, {"slug": "exchange", "title": "Модуль 4 — STRATO.Exchange", "content": "# Модуль 4 — STRATO.Exchange\n\n## Результат модуля\n\nПосле прохождения продавец должен уметь:\n- распознать Exchange-задачу;\n- объяснить продукт через бизнес клиента;\n- провести первичный discovery;\n- отделить готовое ядро от настройки, интеграции и разработки;\n- выбрать правильный демо-сценарий;\n- не перепутать Exchange с Custody;\n- не дать неподтверждённое обещание;\n- определить следующий шаг сделки.\n\n# Урок 4.1. Что такое STRATO.Exchange\n\nПростая модель:\n\n**клиент хочет обменять один актив на другой → получает котировку → создаёт заявку → оплачивает → операция исполняется → система фиксирует результат и даёт оператору контроль.**\n\nЗа этим находятся направления, курс, маржа, лимиты, резерв, заявка, платёж, выплата, статусы, операционная обработка, учёт, сверка и интеграции.\n\n**STRATO.Exchange — не просто сайт обменника. Это программное ядро обменного бизнеса.**\n\n# Урок 4.2. Кому нужен Exchange\n\n## Действующий обменник\nСильные признаки:\n- значимый оборот;\n- старая/самописная система;\n- дорого поддерживать интеграции;\n- зависимость от нескольких разработчиков;\n- много ручных исключений;\n- нужно заменить ядро.\n\n## Новый серьёзный оператор\nПодходит при наличии ЛПР, бизнес-модели, бюджета, срока и готовности инвестировать.\n\n## Банк\nExchange может быть ядром продукта внутри ДБО:\n**ДБО → допуск → котировка → сделка → RUB → ликвидность → цифровой актив → сверка.**\n\n# Урок 4.3. Какую проблему мы ищем\n\nТиповые проблемы:\n- своя разработка стала слишком дорогой;\n- нужно быстро запустить новый продукт;\n- текущая система плохо масштабируется;\n- много ручных операций и ошибок;\n- сложная сверка;\n- нужен свой бренд/домен/on-prem/private контур.\n\nПродажа начинается не с функций, а с разрыва между «как сейчас» и «как должно быть».\n\n# Урок 4.4. Пять блоков Exchange\n\n1. **Котировка и направления** — курс, маржа, лимиты, резерв.\n2. **Заявка** — ID, фиксированный курс, состояния, защита от повторного исполнения.\n3. **Оплата и выплата** — банк/PSP/эквайер/payout/blockchain.\n4. **Операционный контроль** — заявки, статусы, исключения, роли, аудит, сверка.\n5. **API и интеграции** — связь с системами заказчика и провайдерами.\n\n# Урок 4.5. Пять статусов готовности\n\n- **Ready** — уже существует в ядре.\n- **Configure** — нужно настроить.\n- **Integrate** — нужно подключить внешний контур.\n- **Develop** — нужно довести до критерия приёмки.\n- **Not planned** — не входит в базовый Exchange.\n\nГлавное правило: **«есть в коде» не равно «готово к бою».**\n\n# Урок 4.6. Что показывать на демо\n\nБазовый маршрут:\n1. витрина;\n2. направление;\n3. сумма;\n4. котировка;\n5. заявка;\n6. страница статуса;\n7. операторская доска;\n8. курсы/маржа/лимиты/резерв;\n9. API и интеграционный контур на уровне принципа.\n\nДемо должно сопровождаться discovery-вопросами.\n\n# Урок 4.7. Discovery по Exchange\n\n1. Как работаете сейчас?\n2. Какой объём и число операций?\n3. Какие направления?\n4. Откуда берёте курс?\n5. Как задаёте маржу?\n6. Где учитываете резерв?\n7. Как принимается оплата?\n8. Кто делает выплату?\n9. Что делается вручную?\n10. Что чаще ломается?\n11. Как работает операторская команда?\n12. Как выполняется сверка?\n13. Как устроены KYC/AML/KYT?\n14. Нужен ли wallet/custody?\n15. Какие функции обязательны к запуску?\n16. Какой срок?\n17. Кто ЛПР?\n18. Какой порядок бюджета?\n\n# Урок 4.8. Exchange и Custody\n\nExchange управляет обменной сделкой.\n\nCustody — отдельная задача хранения и безопасного подписания.\n\nСигналы Custody:\n- клиентские активы;\n- значимые остатки;\n- несколько подписантов;\n- MPC/TSS;\n- hot/warm/cold;\n- отдельные политики вывода.\n\nWallet-функции Exchange нельзя продавать как полноценный STRATO.Custody.\n\n# Урок 4.9. Что нельзя обещать\n\nНельзя обещать без подтверждения:\n- production за семь дней;\n- любой PSP/банк/эквайер из коробки;\n- любую сеть/актив;\n- все валюты каталога как готовые направления;\n- готовность всех пунктов меню;\n- конкретные SLA/RPO/RTO;\n- конкретную производительность;\n- специальную регуляторную отчётность;\n- юридический допуск;\n- Custody/MPC внутри базового Exchange;\n- срок нестандартной интеграции;\n- исходный код как стандартную часть сделки.\n\n# Урок 4.10. Что означает «7 дней»\n\nКорректно:\n\n**семь дней от полной Day-0 анкеты — до брендированного тестового стенда.**\n\nПосле стенда идут интеграции, доработки, ИБ/UAT, пилот и промышленный запуск.\n\n# Урок 4.11. Как продавать ценность\n\nНе:\n> «У нас много функций».\n\nА:\n> «Вы не строите специализированное ядро обмена с нуля. Берёте существующее ядро, фиксируете fit-gap и доводите его до вашей целевой схемы».\n\nЦенность:\n- меньше разработки с нуля;\n- быстрее проверить/запустить продукт;\n- единое ядро заявки;\n- управляемые курсы, маржа, лимиты и резерв;\n- операционный контроль;\n- интеграционный слой;\n- собственный бренд и инфраструктурный контур.\n\n# Урок 4.12. Следующий шаг сделки\n\n**discovery → демо → fit-gap → матрица поставки → оценка → предложение → внедрение**\n\nМатрица должна разделять:\nReady / Configure / Integrate / Develop / Not planned.\n\n# Практические кейсы\n\n## Кейс 1. Старый самописный обменник\n~$700 тыс./день, 4 разработчика, старая система, новый продукт нужен через 3 месяца.\n\nДействие: проверить интеграции, стоимость поддержки, обязательный scope, ЛПР, бюджет и срок; затем демо + fit-gap.\n\nНельзя обещать «всё заменим за 7 дней».\n\n## Кейс 2. Новый эквайер\nКлиент: «Нам нужен банк X. Вы его поддерживаете?»\n\nДействие: проверить коннектор. Если не подтверждён — Integrate и технический fit-gap.\n\n## Кейс 3. Каталог валют\nКлиент: «Все валюты каталога уже можно менять?»\n\nОтвет: нет. Нужны направление, курс, резерв, сеть и маршрут исполнения.\n\n## Кейс 4. MPC\nКлиент хочет MPC и отдельные политики подписания.\n\nДействие: квалифицировать STRATO.Custody дополнительно к Exchange.\n\n# Мини-тест\n\n1. Что продаёт STRATO.Exchange?  \n   **Ядро обменного бизнеса и проект его внедрения.**\n\n2. Каталог актива означает готовое направление?  \n   **Нет.**\n\n3. Новый PSP без подтверждённого коннектора — какой статус?  \n   **Integrate.**\n\n4. Можно обещать production за 7 дней?  \n   **Нет. 7 дней — до тестового стенда после полной Day-0 анкеты.**\n\n5. Пункт меню «скоро» считается готовой функцией?  \n   **Нет.**\n\n6. Что после discovery и демо?  \n   **Fit-gap и матрица поставки.**\n\n7. MPC и отдельные политики подписания — какой продукт?  \n   **STRATO.Custody.**\n\n8. Можно назвать конкретный RPO/RTO без обследования?  \n   **Нет.**\n\n# Что запомнить\n\n**STRATO.Exchange = готовое ядро обмена + конфигурация + интеграции + согласованные доработки.**\n\nНе продаём меню.  \nНе продаём каталог валют.  \nНе продаём юридический допуск.  \nНе обещаем интеграции без fit-gap.  \nНе смешиваем Exchange и Custody.\n\n# Источники\n\n- `02.1 — STRATO.Exchange — Sales Scope.md`;\n- `LedgerLab-Obmennik-tekhnicheskiy-paket.pdf`;\n- `LedgerLab-Обменник Технический пакет.pdf`;\n- `STRATO.Exchange — LedgerLab.pdf`;\n- `LedgerLab — STRATO.Exchange для банка`;\n- `02 — Карта знаний LedgerLab.md`.\n", "html": "<h1>Модуль 4 — STRATO.Exchange<\/h1>\n<h2>Результат модуля<\/h2>\n<p>После прохождения продавец должен уметь:<\/p>\n<ul>\n<li>распознать Exchange-задачу;<\/li>\n<li>объяснить продукт через бизнес клиента;<\/li>\n<li>провести первичный discovery;<\/li>\n<li>отделить готовое ядро от настройки, интеграции и разработки;<\/li>\n<li>выбрать правильный демо-сценарий;<\/li>\n<li>не перепутать Exchange с Custody;<\/li>\n<li>не дать неподтверждённое обещание;<\/li>\n<li>определить следующий шаг сделки.<\/li>\n<\/ul>\n<h1>Урок 4.1. Что такое STRATO.Exchange<\/h1>\n<p>Простая модель:<\/p>\n<p><strong>клиент хочет обменять один актив на другой → получает котировку → создаёт заявку → оплачивает → операция исполняется → система фиксирует результат и даёт оператору контроль.<\/strong><\/p>\n<p>За этим находятся направления, курс, маржа, лимиты, резерв, заявка, платёж, выплата, статусы, операционная обработка, учёт, сверка и интеграции.<\/p>\n<p><strong>STRATO.Exchange — не просто сайт обменника. Это программное ядро обменного бизнеса.<\/strong><\/p>\n<h1>Урок 4.2. Кому нужен Exchange<\/h1>\n<h2>Действующий обменник<\/h2>\n<p>Сильные признаки:<\/p>\n<ul>\n<li>значимый оборот;<\/li>\n<li>старая/самописная система;<\/li>\n<li>дорого поддерживать интеграции;<\/li>\n<li>зависимость от нескольких разработчиков;<\/li>\n<li>много ручных исключений;<\/li>\n<li>нужно заменить ядро.<\/li>\n<\/ul>\n<h2>Новый серьёзный оператор<\/h2>\n<p>Подходит при наличии ЛПР, бизнес-модели, бюджета, срока и готовности инвестировать.<\/p>\n<h2>Банк<\/h2>\n<p>Exchange может быть ядром продукта внутри ДБО:<\/p>\n<p><strong>ДБО → допуск → котировка → сделка → RUB → ликвидность → цифровой актив → сверка.<\/strong><\/p>\n<h1>Урок 4.3. Какую проблему мы ищем<\/h1>\n<p>Типовые проблемы:<\/p>\n<ul>\n<li>своя разработка стала слишком дорогой;<\/li>\n<li>нужно быстро запустить новый продукт;<\/li>\n<li>текущая система плохо масштабируется;<\/li>\n<li>много ручных операций и ошибок;<\/li>\n<li>сложная сверка;<\/li>\n<li>нужен свой бренд/домен/on-prem/private контур.<\/li>\n<\/ul>\n<p>Продажа начинается не с функций, а с разрыва между «как сейчас» и «как должно быть».<\/p>\n<h1>Урок 4.4. Пять блоков Exchange<\/h1>\n<p>1. <strong>Котировка и направления<\/strong> — курс, маржа, лимиты, резерв.<\/p>\n<p>2. <strong>Заявка<\/strong> — ID, фиксированный курс, состояния, защита от повторного исполнения.<\/p>\n<p>3. <strong>Оплата и выплата<\/strong> — банк/PSP/эквайер/payout/blockchain.<\/p>\n<p>4. <strong>Операционный контроль<\/strong> — заявки, статусы, исключения, роли, аудит, сверка.<\/p>\n<p>5. <strong>API и интеграции<\/strong> — связь с системами заказчика и провайдерами.<\/p>\n<h1>Урок 4.5. Пять статусов готовности<\/h1>\n<ul>\n<li><strong>Ready<\/strong> — уже существует в ядре.<\/li>\n<li><strong>Configure<\/strong> — нужно настроить.<\/li>\n<li><strong>Integrate<\/strong> — нужно подключить внешний контур.<\/li>\n<li><strong>Develop<\/strong> — нужно довести до критерия приёмки.<\/li>\n<li><strong>Not planned<\/strong> — не входит в базовый Exchange.<\/li>\n<\/ul>\n<p>Главное правило: <strong>«есть в коде» не равно «готово к бою».<\/strong><\/p>\n<h1>Урок 4.6. Что показывать на демо<\/h1>\n<p>Базовый маршрут:<\/p>\n<p>1. витрина;<\/p>\n<p>2. направление;<\/p>\n<p>3. сумма;<\/p>\n<p>4. котировка;<\/p>\n<p>5. заявка;<\/p>\n<p>6. страница статуса;<\/p>\n<p>7. операторская доска;<\/p>\n<p>8. курсы/маржа/лимиты/резерв;<\/p>\n<p>9. API и интеграционный контур на уровне принципа.<\/p>\n<p>Демо должно сопровождаться discovery-вопросами.<\/p>\n<h1>Урок 4.7. Discovery по Exchange<\/h1>\n<p>1. Как работаете сейчас?<\/p>\n<p>2. Какой объём и число операций?<\/p>\n<p>3. Какие направления?<\/p>\n<p>4. Откуда берёте курс?<\/p>\n<p>5. Как задаёте маржу?<\/p>\n<p>6. Где учитываете резерв?<\/p>\n<p>7. Как принимается оплата?<\/p>\n<p>8. Кто делает выплату?<\/p>\n<p>9. Что делается вручную?<\/p>\n<p>10. Что чаще ломается?<\/p>\n<p>11. Как работает операторская команда?<\/p>\n<p>12. Как выполняется сверка?<\/p>\n<p>13. Как устроены KYC/AML/KYT?<\/p>\n<p>14. Нужен ли wallet/custody?<\/p>\n<p>15. Какие функции обязательны к запуску?<\/p>\n<p>16. Какой срок?<\/p>\n<p>17. Кто ЛПР?<\/p>\n<p>18. Какой порядок бюджета?<\/p>\n<h1>Урок 4.8. Exchange и Custody<\/h1>\n<p>Exchange управляет обменной сделкой.<\/p>\n<p>Custody — отдельная задача хранения и безопасного подписания.<\/p>\n<p>Сигналы Custody:<\/p>\n<ul>\n<li>клиентские активы;<\/li>\n<li>значимые остатки;<\/li>\n<li>несколько подписантов;<\/li>\n<li>MPC/TSS;<\/li>\n<li>hot/warm/cold;<\/li>\n<li>отдельные политики вывода.<\/li>\n<\/ul>\n<p>Wallet-функции Exchange нельзя продавать как полноценный STRATO.Custody.<\/p>\n<h1>Урок 4.9. Что нельзя обещать<\/h1>\n<p>Нельзя обещать без подтверждения:<\/p>\n<ul>\n<li>production за семь дней;<\/li>\n<li>любой PSP/банк/эквайер из коробки;<\/li>\n<li>любую сеть/актив;<\/li>\n<li>все валюты каталога как готовые направления;<\/li>\n<li>готовность всех пунктов меню;<\/li>\n<li>конкретные SLA/RPO/RTO;<\/li>\n<li>конкретную производительность;<\/li>\n<li>специальную регуляторную отчётность;<\/li>\n<li>юридический допуск;<\/li>\n<li>Custody/MPC внутри базового Exchange;<\/li>\n<li>срок нестандартной интеграции;<\/li>\n<li>исходный код как стандартную часть сделки.<\/li>\n<\/ul>\n<h1>Урок 4.10. Что означает «7 дней»<\/h1>\n<p>Корректно:<\/p>\n<p><strong>семь дней от полной Day-0 анкеты — до брендированного тестового стенда.<\/strong><\/p>\n<p>После стенда идут интеграции, доработки, ИБ/UAT, пилот и промышленный запуск.<\/p>\n<h1>Урок 4.11. Как продавать ценность<\/h1>\n<p>Не:<\/p>\n<blockquote>t; «У нас много функций».<\/blockquote>\n<p>А:<\/p>\n<blockquote>t; «Вы не строите специализированное ядро обмена с нуля. Берёте существующее ядро, фиксируете fit-gap и доводите его до вашей целевой схемы».<\/blockquote>\n<p>Ценность:<\/p>\n<ul>\n<li>меньше разработки с нуля;<\/li>\n<li>быстрее проверить/запустить продукт;<\/li>\n<li>единое ядро заявки;<\/li>\n<li>управляемые курсы, маржа, лимиты и резерв;<\/li>\n<li>операционный контроль;<\/li>\n<li>интеграционный слой;<\/li>\n<li>собственный бренд и инфраструктурный контур.<\/li>\n<\/ul>\n<h1>Урок 4.12. Следующий шаг сделки<\/h1>\n<p><strong>discovery → демо → fit-gap → матрица поставки → оценка → предложение → внедрение<\/strong><\/p>\n<p>Матрица должна разделять:<\/p>\n<p>Ready / Configure / Integrate / Develop / Not planned.<\/p>\n<h1>Практические кейсы<\/h1>\n<h2>Кейс 1. Старый самописный обменник<\/h2>\n<p>~$700 тыс./день, 4 разработчика, старая система, новый продукт нужен через 3 месяца.<\/p>\n<p>Действие: проверить интеграции, стоимость поддержки, обязательный scope, ЛПР, бюджет и срок; затем демо + fit-gap.<\/p>\n<p>Нельзя обещать «всё заменим за 7 дней».<\/p>\n<h2>Кейс 2. Новый эквайер<\/h2>\n<p>Клиент: «Нам нужен банк X. Вы его поддерживаете?»<\/p>\n<p>Действие: проверить коннектор. Если не подтверждён — Integrate и технический fit-gap.<\/p>\n<h2>Кейс 3. Каталог валют<\/h2>\n<p>Клиент: «Все валюты каталога уже можно менять?»<\/p>\n<p>Ответ: нет. Нужны направление, курс, резерв, сеть и маршрут исполнения.<\/p>\n<h2>Кейс 4. MPC<\/h2>\n<p>Клиент хочет MPC и отдельные политики подписания.<\/p>\n<p>Действие: квалифицировать STRATO.Custody дополнительно к Exchange.<\/p>\n<h1>Мини-тест<\/h1>\n<p>1. Что продаёт STRATO.Exchange?  <\/p>\n<p>   <strong>Ядро обменного бизнеса и проект его внедрения.<\/strong><\/p>\n<p>2. Каталог актива означает готовое направление?  <\/p>\n<p>   <strong>Нет.<\/strong><\/p>\n<p>3. Новый PSP без подтверждённого коннектора — какой статус?  <\/p>\n<p>   <strong>Integrate.<\/strong><\/p>\n<p>4. Можно обещать production за 7 дней?  <\/p>\n<p>   <strong>Нет. 7 дней — до тестового стенда после полной Day-0 анкеты.<\/strong><\/p>\n<p>5. Пункт меню «скоро» считается готовой функцией?  <\/p>\n<p>   <strong>Нет.<\/strong><\/p>\n<p>6. Что после discovery и демо?  <\/p>\n<p>   <strong>Fit-gap и матрица поставки.<\/strong><\/p>\n<p>7. MPC и отдельные политики подписания — какой продукт?  <\/p>\n<p>   <strong>STRATO.Custody.<\/strong><\/p>\n<p>8. Можно назвать конкретный RPO/RTO без обследования?  <\/p>\n<p>   <strong>Нет.<\/strong><\/p>\n<h1>Что запомнить<\/h1>\n<p><strong>STRATO.Exchange = готовое ядро обмена + конфигурация + интеграции + согласованные доработки.<\/strong><\/p>\n<p>Не продаём меню.  <\/p>\n<p>Не продаём каталог валют.  <\/p>\n<p>Не продаём юридический допуск.  <\/p>\n<p>Не обещаем интеграции без fit-gap.  <\/p>\n<p>Не смешиваем Exchange и Custody.<\/p>\n<h1>Источники<\/h1>\n<ul>\n<li><code>02.1 — STRATO.Exchange — Sales Scope.md<\/code>;<\/li>\n<li><code>LedgerLab-Obmennik-tekhnicheskiy-paket.pdf<\/code>;<\/li>\n<li><code>LedgerLab-Обменник Технический пакет.pdf<\/code>;<\/li>\n<li><code>STRATO.Exchange — LedgerLab.pdf<\/code>;<\/li>\n<li><code>LedgerLab — STRATO.Exchange для банка<\/code>;<\/li>\n<li><code>02 — Карта знаний LedgerLab.md<\/code>.<\/li>\n<\/ul>"}, {"slug": "custody", "title": "Модуль 5 — STRATO.Custody", "content": "# Модуль 5 — STRATO.Custody\n\n## Результат модуля\n\nПосле прохождения продавец должен:\n- понимать, какую бизнес-задачу решает Custody;\n- объяснять движение цифрового актива от депозитного адреса до вывода;\n- простыми словами различать MPC и TSS;\n- понимать назначение hot / warm / cold;\n- проводить первичный discovery;\n- отделять готовое ядро от работ до приёмки;\n- не путать технический учёт Custody с клиентским/бухгалтерским учётом;\n- не обещать неподтверждённые сети, HSM, omnibus или регуляторный результат;\n- вовремя подключать архитектора, ИБ и продукт.\n\n# Урок 5.1. Что такое STRATO.Custody\n\nПростая модель:\n\n**система выдаёт адрес → видит поступление в блокчейне → учитывает его → консолидирует средства → получает авторизованную команду на вывод → подписывает транзакцию по заданным правилам → отправляет её в сеть → фиксирует статус и даёт данные для сверки.**\n\nSTRATO.Custody — это не просто «кошелёк».\n\nЭто инфраструктурный контур, который соединяет:\n- адреса;\n- blockchain monitoring;\n- технические остатки;\n- консолидацию;\n- вывод;\n- ключи;\n- подпись;\n- роли;\n- политики;\n- аудит;\n- интеграции;\n- восстановление.\n\n# Урок 5.2. Какой scope подтверждён сегодня\n\nБазовый подтверждённый scope:\n\n**USDT TRC-20 в сети TRON.**\n\nПодтверждены:\n- персональные адреса;\n- приём и подтверждение поступлений;\n- технические балансы;\n- консолидация;\n- вывод;\n- автоматический TSS;\n- компоненты казначейского контура;\n- API для систем заказчика;\n- сверка и операционные данные.\n\nВ коде есть компоненты других сетей, но это не даёт продавцу права обещать их клиенту.\n\n# Урок 5.3. Кому нужен Custody\n\nВ текущем курсе основной подтверждённый ICP:\n\n## Банк / регулируемый институциональный контур\n\nСигналы потребности:\n- банк хочет хранить цифровые активы в собственном технологическом периметре;\n- нужны персональные депозитные адреса;\n- нужны правила подписания;\n- нужен контроль сотрудников и кворумов;\n- нужны интеграции с внутренним учётом, SIEM/IAM и мониторингом;\n- нужны аудит, сверка и восстановление.\n\nДля небанковских сегментов потенциальная потребность есть, но приоритетные ICP должны быть отдельно утверждены в `LLA-014`.\n\n# Урок 5.4. Как движутся средства\n\n## Поступление\n\n1. Система заказчика запрашивает адрес.\n2. Custody возвращает персональный адрес.\n3. Индексатор наблюдает blockchain.\n4. Транзакция получает подтверждения.\n5. Поступление отражается в `locked`.\n6. После консолидации технический остаток становится `available`.\n\n## Вывод\n\n1. Доверенная система заказчика принимает бизнес-решение.\n2. Передаёт авторизованную команду.\n3. Custody создаёт удержание суммы.\n4. Формирует транзакцию.\n5. Получает распределённую подпись.\n6. Отправляет транзакцию.\n7. Отслеживает blockchain-результат.\n8. Обновляет технический учёт и отдаёт событие/статус заказчику.\n\n# Урок 5.5. Технический учёт ≠ клиентский учёт\n\nЭто критически важно.\n\nCustody знает:\n- адрес;\n- blockchain-транзакцию;\n- `locked`;\n- `available`;\n- удержания;\n- техническую историю.\n\nНо основной реестр того:\n- какому клиенту принадлежат обязательства;\n- что отражено в бухгалтерском учёте;\n- какие договорные права есть у клиента,\n\nведёт заказчик.\n\n**Продавец не должен говорить, что Custody автоматически заменяет АБС, бухгалтерский или клиентский реестр.**\n\n# Урок 5.6. MPC и TSS простыми словами\n\n## MPC\n\nMPC — общий подход, при котором несколько участников совместно выполняют криптографическую операцию, не собирая полный секрет в одном месте.\n\n## TSS\n\nTSS — пороговая схема подписи: операция подписывается, только если собрано достаточное число участников/долей.\n\nВ текущем техническом пакете автоматический контур подписи обозначен как **TSS**.\n\nПродавцу важно не спорить о терминологии с ИБ-командой клиента.\n\nПравильная формулировка:\n\n**«В STRATO.Custody используется распределённый пороговый контур подписи. Конкретные n, порог, размещение участников и модель восстановления фиксируются на обследовании».**\n\n# Урок 5.7. Автоматический и казначейский контуры\n\n## Автоматический TSS\n\nНужен для операций, которые система может подписывать автоматически по установленным правилам.\n\nЕсть несколько TSS-участников; доли разделены.\n\n## Казначейский контур\n\nИспользуется там, где нужны сотрудники-подписанты и ручное участие:\n- координатор;\n- серверные участники;\n- устройства сотрудников;\n- кабинет подписанта;\n- кворум.\n\nКонкретная сквозная интеграция казначейского контура входит в работы до приёмки.\n\n# Урок 5.8. Hot / Warm / Cold\n\nЭто не три разных продукта. Это способ разделить активы и операции по риску.\n\n## Hot\nОборотный запас. Высокая доступность. Больше автоматизации. Жёсткие лимиты.\n\n## Warm\nКазначейский буфер. Больше ручного контроля и распределённого подписания.\n\n## Cold\nОсновной запас. Минимальная оперативная доступность. Усиленные/офлайн процедуры.\n\nНа discovery нужно выяснить не «нужен ли cold wallet», а:\n\n**сколько средств должно быть доступно автоматически, какие операции требуют человека и что должно быть максимально изолировано.**\n\n# Урок 5.9. Что готово, а что доводится\n\nИспользуем ту же модель, что в Exchange:\n\n- **Ready**;\n- **Configure**;\n- **Integrate**;\n- **Develop**;\n- **Not planned**.\n\nГлавное правило Custody:\n\n**W-01…W-20 — работы до приёмки. Они входят в проектный объём, но не считаются автоматически уже принятыми функциями.**\n\nПримеры Develop:\n- политики вывода;\n- whitelist;\n- второй сотрудник;\n- admin UI;\n- SSO/MFA;\n- единый audit;\n- дополнительные events;\n- end-to-end treasury;\n- monitoring/readiness;\n- backup ключевого материала;\n- CI/SAST/SBOM;\n- документация под контур заказчика.\n\n# Урок 5.10. Граница ответственности\n\n## Custody отвечает за технический денежный путь\n\nАдреса → blockchain events → технический учёт → консолидация → транзакция → подпись → broadcast → статус.\n\n## Заказчик отвечает за бизнес-решение\n\nЗаказчик определяет:\n- клиента;\n- KYC/AML;\n- договор;\n- право клиента на операцию;\n- бизнес-правила;\n- основной учёт;\n- кто имеет право инициировать вывод;\n- эксплуатационные регламенты.\n\n# Урок 5.11. Что интегрируем\n\nДля банка/enterprise почти всегда нужны:\n- API систем клиента;\n- client/account mapping;\n- внутренний учёт;\n- IAM/SSO;\n- SIEM;\n- monitoring;\n- indexer;\n- TRON nodes;\n- webhooks/events;\n- infrastructure;\n- backup/DR.\n\nCustody нельзя продавать как изолированную «коробку без проекта интеграции».\n\n# Урок 5.12. Что нельзя обещать\n\nБез отдельного подтверждения продавец не обещает:\n- Bitcoin/Ethereum/BSC и другие сети как готовый scope;\n- USDC или другие активы;\n- omnibus;\n- HSM/KMS;\n- полноценный клиентский интерфейс;\n- KYC/AML как функцию принятия решения за заказчика;\n- бухгалтерский учёт;\n- active-active процессинг;\n- конкретные RPO/RTO/SLA;\n- готовность всех W-01…W-20;\n- универсальную m-of-n конфигурацию;\n- конкретную производительность;\n- исходный код;\n- регуляторный допуск.\n\n# Урок 5.13. Discovery по Custody\n\n1. Какие активы и сети?\n2. Чьи активы — собственные или клиентские?\n3. Сколько клиентов/адресов?\n4. Какой объём AUM/остатков?\n5. Сколько входящих и выводов в сутки/пик?\n6. Нужны персональные адреса или другая модель?\n7. Где основной клиентский и бухгалтерский учёт?\n8. Кто принимает решение о выводе?\n9. Какие лимиты?\n10. Нужны whitelist?\n11. Какие операции должны быть автоматическими?\n12. Какие требуют второго сотрудника?\n13. Какая модель hot/warm/cold?\n14. Сколько подписантов?\n15. Где должны храниться/работать доли?\n16. Как устроены IAM/SSO/SIEM?\n17. Какая инфраструктура: on-prem/private cloud?\n18. Какие RPO/RTO/SLA?\n19. Какие требования ИБ и threat model?\n20. Как будет работать аварийное восстановление?\n21. Кто ЛПР по бизнесу, ИТ, ИБ и комплаенсу?\n22. Срок и бюджет?\n\n# Урок 5.14. Как продавать ценность\n\nНе:\n\n> «У нас MPC-кошелёк».\n\nА:\n\n> «Мы даём готовое ядро custody-процессинга и распределённой подписи, которое встраивается в ваш учёт, ИБ и операционные регламенты».\n\nЦенность:\n- не строить ключевой и blockchain-контур с нуля;\n- разделить автоматические и ручные операции;\n- иметь персональные адреса и технический учёт;\n- управлять политиками и подписанием;\n- встроиться в корпоративный периметр;\n- пройти проектную приёмку с понятной матрицей scope.\n\n# Урок 5.15. Следующий шаг сделки\n\nПравильная последовательность:\n\n**discovery → модель хранения и подписания → архитектурная сессия → fit-gap → матрица поставки → тестовый контур → ИБ/испытания → приёмка → production.**\n\n# Практические кейсы\n\n## Кейс 1. Банк хочет USDT\n\nБанк хочет персональные USDT TRC-20 адреса, хранение в своём периметре и ручное согласование крупных выводов.\n\nЭто подтверждённый Custody-сценарий.\n\nСледующий шаг — выяснить:\n- учёт;\n- число адресов;\n- объёмы;\n- модель подписания;\n- интеграции;\n- ИБ;\n- RPO/RTO;\n- критерии приёмки.\n\n## Кейс 2. «У вас же есть Bitcoin в коде»\n\nПравильный ответ:\n\n**«Наличие модуля в коде не означает включение сети в поставку. Базово подтверждён USDT TRC-20; Bitcoin оценивается отдельным change request».**\n\n## Кейс 3. «Давайте 2 из 3»\n\nНельзя просто подтвердить.\n\nНужно выяснить:\n- автоматический или казначейский контур;\n- число участников;\n- зоны;\n- устройства;\n- восстановление;\n- threat model.\n\n## Кейс 4. «Custody будет вести баланс наших клиентов»\n\nПравильный ответ:\n\n**Custody ведёт технические остатки и историю операций. Основной клиентский/бухгалтерский реестр остаётся в системах заказчика.**\n\n## Кейс 5. «Нам нужен общий omnibus-кошелёк»\n\nOmnibus не является базовой моделью. Нужно проектировать отдельно под учётную и регуляторную схему.\n\n# Мини-тест\n\n1. Какой базовый asset/network подтверждён?  \n**USDT TRC-20 / TRON.**\n\n2. Наличие Bitcoin-модуля в коде означает готовность продажи?  \n**Нет.**\n\n3. Что происходит с подтверждённым поступлением до консолидации?  \n**Оно отражается как locked.**\n\n4. Что после подтверждённой консолидации?  \n**Технический остаток становится available.**\n\n5. Заменяет ли технический баланс Custody бухгалтерский учёт клиента?  \n**Нет.**\n\n6. Что такое TSS на уровне продавца?  \n**Пороговая распределённая подпись: для операции требуется достаточное число участников/долей.**\n\n7. Можно обещать конкретное n/m без обследования?  \n**Нет.**\n\n8. W-01…W-20 означают, что функции уже приняты?  \n**Нет. Это работы до приёмки.**\n\n9. Omnibus входит в базовую модель?  \n**Нет.**\n\n10. Кто принимает бизнес-решение о допустимости вывода?  \n**Система/процессы заказчика, не Custody core.**\n\n# Что запомнить\n\n**STRATO.Custody = адреса + blockchain processing + технический учёт + консолидация + вывод + распределённая подпись + интеграция с системами заказчика.**\n\nБазовый scope — USDT TRC-20.  \nНе продаём другие сети по факту наличия кода.  \nНе смешиваем технический и бухгалтерский учёт.  \nНе выдаём W-01…W-20 за уже принятые функции.  \nНе обещаем ключевую модель до ИБ/архитектурного обследования.\n\n# Источники\n\n- `02.2 — STRATO.Custody — Sales Scope.md`;\n- `LedgerLab_Кастодиан_Технический_пакет.pdf`, версия 1.0 от 29.09.2026;\n- `LedgerLab — Кастодиан для банка`;\n- `02 — Карта знаний LedgerLab.md`.\n", "html": "<h1>Модуль 5 — STRATO.Custody<\/h1>\n<h2>Результат модуля<\/h2>\n<p>После прохождения продавец должен:<\/p>\n<ul>\n<li>понимать, какую бизнес-задачу решает Custody;<\/li>\n<li>объяснять движение цифрового актива от депозитного адреса до вывода;<\/li>\n<li>простыми словами различать MPC и TSS;<\/li>\n<li>понимать назначение hot / warm / cold;<\/li>\n<li>проводить первичный discovery;<\/li>\n<li>отделять готовое ядро от работ до приёмки;<\/li>\n<li>не путать технический учёт Custody с клиентским/бухгалтерским учётом;<\/li>\n<li>не обещать неподтверждённые сети, HSM, omnibus или регуляторный результат;<\/li>\n<li>вовремя подключать архитектора, ИБ и продукт.<\/li>\n<\/ul>\n<h1>Урок 5.1. Что такое STRATO.Custody<\/h1>\n<p>Простая модель:<\/p>\n<p><strong>система выдаёт адрес → видит поступление в блокчейне → учитывает его → консолидирует средства → получает авторизованную команду на вывод → подписывает транзакцию по заданным правилам → отправляет её в сеть → фиксирует статус и даёт данные для сверки.<\/strong><\/p>\n<p>STRATO.Custody — это не просто «кошелёк».<\/p>\n<p>Это инфраструктурный контур, который соединяет:<\/p>\n<ul>\n<li>адреса;<\/li>\n<li>blockchain monitoring;<\/li>\n<li>технические остатки;<\/li>\n<li>консолидацию;<\/li>\n<li>вывод;<\/li>\n<li>ключи;<\/li>\n<li>подпись;<\/li>\n<li>роли;<\/li>\n<li>политики;<\/li>\n<li>аудит;<\/li>\n<li>интеграции;<\/li>\n<li>восстановление.<\/li>\n<\/ul>\n<h1>Урок 5.2. Какой scope подтверждён сегодня<\/h1>\n<p>Базовый подтверждённый scope:<\/p>\n<p><strong>USDT TRC-20 в сети TRON.<\/strong><\/p>\n<p>Подтверждены:<\/p>\n<ul>\n<li>персональные адреса;<\/li>\n<li>приём и подтверждение поступлений;<\/li>\n<li>технические балансы;<\/li>\n<li>консолидация;<\/li>\n<li>вывод;<\/li>\n<li>автоматический TSS;<\/li>\n<li>компоненты казначейского контура;<\/li>\n<li>API для систем заказчика;<\/li>\n<li>сверка и операционные данные.<\/li>\n<\/ul>\n<p>В коде есть компоненты других сетей, но это не даёт продавцу права обещать их клиенту.<\/p>\n<h1>Урок 5.3. Кому нужен Custody<\/h1>\n<p>В текущем курсе основной подтверждённый ICP:<\/p>\n<h2>Банк / регулируемый институциональный контур<\/h2>\n<p>Сигналы потребности:<\/p>\n<ul>\n<li>банк хочет хранить цифровые активы в собственном технологическом периметре;<\/li>\n<li>нужны персональные депозитные адреса;<\/li>\n<li>нужны правила подписания;<\/li>\n<li>нужен контроль сотрудников и кворумов;<\/li>\n<li>нужны интеграции с внутренним учётом, SIEM/IAM и мониторингом;<\/li>\n<li>нужны аудит, сверка и восстановление.<\/li>\n<\/ul>\n<p>Для небанковских сегментов потенциальная потребность есть, но приоритетные ICP должны быть отдельно утверждены в <code>LLA-014<\/code>.<\/p>\n<h1>Урок 5.4. Как движутся средства<\/h1>\n<h2>Поступление<\/h2>\n<p>1. Система заказчика запрашивает адрес.<\/p>\n<p>2. Custody возвращает персональный адрес.<\/p>\n<p>3. Индексатор наблюдает blockchain.<\/p>\n<p>4. Транзакция получает подтверждения.<\/p>\n<p>5. Поступление отражается в <code>locked<\/code>.<\/p>\n<p>6. После консолидации технический остаток становится <code>available<\/code>.<\/p>\n<h2>Вывод<\/h2>\n<p>1. Доверенная система заказчика принимает бизнес-решение.<\/p>\n<p>2. Передаёт авторизованную команду.<\/p>\n<p>3. Custody создаёт удержание суммы.<\/p>\n<p>4. Формирует транзакцию.<\/p>\n<p>5. Получает распределённую подпись.<\/p>\n<p>6. Отправляет транзакцию.<\/p>\n<p>7. Отслеживает blockchain-результат.<\/p>\n<p>8. Обновляет технический учёт и отдаёт событие/статус заказчику.<\/p>\n<h1>Урок 5.5. Технический учёт ≠ клиентский учёт<\/h1>\n<p>Это критически важно.<\/p>\n<p>Custody знает:<\/p>\n<ul>\n<li>адрес;<\/li>\n<li>blockchain-транзакцию;<\/li>\n<li><code>locked<\/code>;<\/li>\n<li><code>available<\/code>;<\/li>\n<li>удержания;<\/li>\n<li>техническую историю.<\/li>\n<\/ul>\n<p>Но основной реестр того:<\/p>\n<ul>\n<li>какому клиенту принадлежат обязательства;<\/li>\n<li>что отражено в бухгалтерском учёте;<\/li>\n<li>какие договорные права есть у клиента,<\/li>\n<\/ul>\n<p>ведёт заказчик.<\/p>\n<p><strong>Продавец не должен говорить, что Custody автоматически заменяет АБС, бухгалтерский или клиентский реестр.<\/strong><\/p>\n<h1>Урок 5.6. MPC и TSS простыми словами<\/h1>\n<h2>MPC<\/h2>\n<p>MPC — общий подход, при котором несколько участников совместно выполняют криптографическую операцию, не собирая полный секрет в одном месте.<\/p>\n<h2>TSS<\/h2>\n<p>TSS — пороговая схема подписи: операция подписывается, только если собрано достаточное число участников/долей.<\/p>\n<p>В текущем техническом пакете автоматический контур подписи обозначен как <strong>TSS<\/strong>.<\/p>\n<p>Продавцу важно не спорить о терминологии с ИБ-командой клиента.<\/p>\n<p>Правильная формулировка:<\/p>\n<p><strong>«В STRATO.Custody используется распределённый пороговый контур подписи. Конкретные n, порог, размещение участников и модель восстановления фиксируются на обследовании».<\/strong><\/p>\n<h1>Урок 5.7. Автоматический и казначейский контуры<\/h1>\n<h2>Автоматический TSS<\/h2>\n<p>Нужен для операций, которые система может подписывать автоматически по установленным правилам.<\/p>\n<p>Есть несколько TSS-участников; доли разделены.<\/p>\n<h2>Казначейский контур<\/h2>\n<p>Используется там, где нужны сотрудники-подписанты и ручное участие:<\/p>\n<ul>\n<li>координатор;<\/li>\n<li>серверные участники;<\/li>\n<li>устройства сотрудников;<\/li>\n<li>кабинет подписанта;<\/li>\n<li>кворум.<\/li>\n<\/ul>\n<p>Конкретная сквозная интеграция казначейского контура входит в работы до приёмки.<\/p>\n<h1>Урок 5.8. Hot / Warm / Cold<\/h1>\n<p>Это не три разных продукта. Это способ разделить активы и операции по риску.<\/p>\n<h2>Hot<\/h2>\n<p>Оборотный запас. Высокая доступность. Больше автоматизации. Жёсткие лимиты.<\/p>\n<h2>Warm<\/h2>\n<p>Казначейский буфер. Больше ручного контроля и распределённого подписания.<\/p>\n<h2>Cold<\/h2>\n<p>Основной запас. Минимальная оперативная доступность. Усиленные/офлайн процедуры.<\/p>\n<p>На discovery нужно выяснить не «нужен ли cold wallet», а:<\/p>\n<p><strong>сколько средств должно быть доступно автоматически, какие операции требуют человека и что должно быть максимально изолировано.<\/strong><\/p>\n<h1>Урок 5.9. Что готово, а что доводится<\/h1>\n<p>Используем ту же модель, что в Exchange:<\/p>\n<ul>\n<li><strong>Ready<\/strong>;<\/li>\n<li><strong>Configure<\/strong>;<\/li>\n<li><strong>Integrate<\/strong>;<\/li>\n<li><strong>Develop<\/strong>;<\/li>\n<li><strong>Not planned<\/strong>.<\/li>\n<\/ul>\n<p>Главное правило Custody:<\/p>\n<p><strong>W-01…W-20 — работы до приёмки. Они входят в проектный объём, но не считаются автоматически уже принятыми функциями.<\/strong><\/p>\n<p>Примеры Develop:<\/p>\n<ul>\n<li>политики вывода;<\/li>\n<li>whitelist;<\/li>\n<li>второй сотрудник;<\/li>\n<li>admin UI;<\/li>\n<li>SSO/MFA;<\/li>\n<li>единый audit;<\/li>\n<li>дополнительные events;<\/li>\n<li>end-to-end treasury;<\/li>\n<li>monitoring/readiness;<\/li>\n<li>backup ключевого материала;<\/li>\n<li>CI/SAST/SBOM;<\/li>\n<li>документация под контур заказчика.<\/li>\n<\/ul>\n<h1>Урок 5.10. Граница ответственности<\/h1>\n<h2>Custody отвечает за технический денежный путь<\/h2>\n<p>Адреса → blockchain events → технический учёт → консолидация → транзакция → подпись → broadcast → статус.<\/p>\n<h2>Заказчик отвечает за бизнес-решение<\/h2>\n<p>Заказчик определяет:<\/p>\n<ul>\n<li>клиента;<\/li>\n<li>KYC/AML;<\/li>\n<li>договор;<\/li>\n<li>право клиента на операцию;<\/li>\n<li>бизнес-правила;<\/li>\n<li>основной учёт;<\/li>\n<li>кто имеет право инициировать вывод;<\/li>\n<li>эксплуатационные регламенты.<\/li>\n<\/ul>\n<h1>Урок 5.11. Что интегрируем<\/h1>\n<p>Для банка/enterprise почти всегда нужны:<\/p>\n<ul>\n<li>API систем клиента;<\/li>\n<li>client/account mapping;<\/li>\n<li>внутренний учёт;<\/li>\n<li>IAM/SSO;<\/li>\n<li>SIEM;<\/li>\n<li>monitoring;<\/li>\n<li>indexer;<\/li>\n<li>TRON nodes;<\/li>\n<li>webhooks/events;<\/li>\n<li>infrastructure;<\/li>\n<li>backup/DR.<\/li>\n<\/ul>\n<p>Custody нельзя продавать как изолированную «коробку без проекта интеграции».<\/p>\n<h1>Урок 5.12. Что нельзя обещать<\/h1>\n<p>Без отдельного подтверждения продавец не обещает:<\/p>\n<ul>\n<li>Bitcoin/Ethereum/BSC и другие сети как готовый scope;<\/li>\n<li>USDC или другие активы;<\/li>\n<li>omnibus;<\/li>\n<li>HSM/KMS;<\/li>\n<li>полноценный клиентский интерфейс;<\/li>\n<li>KYC/AML как функцию принятия решения за заказчика;<\/li>\n<li>бухгалтерский учёт;<\/li>\n<li>active-active процессинг;<\/li>\n<li>конкретные RPO/RTO/SLA;<\/li>\n<li>готовность всех W-01…W-20;<\/li>\n<li>универсальную m-of-n конфигурацию;<\/li>\n<li>конкретную производительность;<\/li>\n<li>исходный код;<\/li>\n<li>регуляторный допуск.<\/li>\n<\/ul>\n<h1>Урок 5.13. Discovery по Custody<\/h1>\n<p>1. Какие активы и сети?<\/p>\n<p>2. Чьи активы — собственные или клиентские?<\/p>\n<p>3. Сколько клиентов/адресов?<\/p>\n<p>4. Какой объём AUM/остатков?<\/p>\n<p>5. Сколько входящих и выводов в сутки/пик?<\/p>\n<p>6. Нужны персональные адреса или другая модель?<\/p>\n<p>7. Где основной клиентский и бухгалтерский учёт?<\/p>\n<p>8. Кто принимает решение о выводе?<\/p>\n<p>9. Какие лимиты?<\/p>\n<p>10. Нужны whitelist?<\/p>\n<p>11. Какие операции должны быть автоматическими?<\/p>\n<p>12. Какие требуют второго сотрудника?<\/p>\n<p>13. Какая модель hot/warm/cold?<\/p>\n<p>14. Сколько подписантов?<\/p>\n<p>15. Где должны храниться/работать доли?<\/p>\n<p>16. Как устроены IAM/SSO/SIEM?<\/p>\n<p>17. Какая инфраструктура: on-prem/private cloud?<\/p>\n<p>18. Какие RPO/RTO/SLA?<\/p>\n<p>19. Какие требования ИБ и threat model?<\/p>\n<p>20. Как будет работать аварийное восстановление?<\/p>\n<p>21. Кто ЛПР по бизнесу, ИТ, ИБ и комплаенсу?<\/p>\n<p>22. Срок и бюджет?<\/p>\n<h1>Урок 5.14. Как продавать ценность<\/h1>\n<p>Не:<\/p>\n<blockquote>t; «У нас MPC-кошелёк».<\/blockquote>\n<p>А:<\/p>\n<blockquote>t; «Мы даём готовое ядро custody-процессинга и распределённой подписи, которое встраивается в ваш учёт, ИБ и операционные регламенты».<\/blockquote>\n<p>Ценность:<\/p>\n<ul>\n<li>не строить ключевой и blockchain-контур с нуля;<\/li>\n<li>разделить автоматические и ручные операции;<\/li>\n<li>иметь персональные адреса и технический учёт;<\/li>\n<li>управлять политиками и подписанием;<\/li>\n<li>встроиться в корпоративный периметр;<\/li>\n<li>пройти проектную приёмку с понятной матрицей scope.<\/li>\n<\/ul>\n<h1>Урок 5.15. Следующий шаг сделки<\/h1>\n<p>Правильная последовательность:<\/p>\n<p><strong>discovery → модель хранения и подписания → архитектурная сессия → fit-gap → матрица поставки → тестовый контур → ИБ/испытания → приёмка → production.<\/strong><\/p>\n<h1>Практические кейсы<\/h1>\n<h2>Кейс 1. Банк хочет USDT<\/h2>\n<p>Банк хочет персональные USDT TRC-20 адреса, хранение в своём периметре и ручное согласование крупных выводов.<\/p>\n<p>Это подтверждённый Custody-сценарий.<\/p>\n<p>Следующий шаг — выяснить:<\/p>\n<ul>\n<li>учёт;<\/li>\n<li>число адресов;<\/li>\n<li>объёмы;<\/li>\n<li>модель подписания;<\/li>\n<li>интеграции;<\/li>\n<li>ИБ;<\/li>\n<li>RPO/RTO;<\/li>\n<li>критерии приёмки.<\/li>\n<\/ul>\n<h2>Кейс 2. «У вас же есть Bitcoin в коде»<\/h2>\n<p>Правильный ответ:<\/p>\n<p><strong>«Наличие модуля в коде не означает включение сети в поставку. Базово подтверждён USDT TRC-20; Bitcoin оценивается отдельным change request».<\/strong><\/p>\n<h2>Кейс 3. «Давайте 2 из 3»<\/h2>\n<p>Нельзя просто подтвердить.<\/p>\n<p>Нужно выяснить:<\/p>\n<ul>\n<li>автоматический или казначейский контур;<\/li>\n<li>число участников;<\/li>\n<li>зоны;<\/li>\n<li>устройства;<\/li>\n<li>восстановление;<\/li>\n<li>threat model.<\/li>\n<\/ul>\n<h2>Кейс 4. «Custody будет вести баланс наших клиентов»<\/h2>\n<p>Правильный ответ:<\/p>\n<p><strong>Custody ведёт технические остатки и историю операций. Основной клиентский/бухгалтерский реестр остаётся в системах заказчика.<\/strong><\/p>\n<h2>Кейс 5. «Нам нужен общий omnibus-кошелёк»<\/h2>\n<p>Omnibus не является базовой моделью. Нужно проектировать отдельно под учётную и регуляторную схему.<\/p>\n<h1>Мини-тест<\/h1>\n<p>1. Какой базовый asset/network подтверждён?  <\/p>\n<p><strong>USDT TRC-20 / TRON.<\/strong><\/p>\n<p>2. Наличие Bitcoin-модуля в коде означает готовность продажи?  <\/p>\n<p><strong>Нет.<\/strong><\/p>\n<p>3. Что происходит с подтверждённым поступлением до консолидации?  <\/p>\n<p><strong>Оно отражается как locked.<\/strong><\/p>\n<p>4. Что после подтверждённой консолидации?  <\/p>\n<p><strong>Технический остаток становится available.<\/strong><\/p>\n<p>5. Заменяет ли технический баланс Custody бухгалтерский учёт клиента?  <\/p>\n<p><strong>Нет.<\/strong><\/p>\n<p>6. Что такое TSS на уровне продавца?  <\/p>\n<p><strong>Пороговая распределённая подпись: для операции требуется достаточное число участников/долей.<\/strong><\/p>\n<p>7. Можно обещать конкретное n/m без обследования?  <\/p>\n<p><strong>Нет.<\/strong><\/p>\n<p>8. W-01…W-20 означают, что функции уже приняты?  <\/p>\n<p><strong>Нет. Это работы до приёмки.<\/strong><\/p>\n<p>9. Omnibus входит в базовую модель?  <\/p>\n<p><strong>Нет.<\/strong><\/p>\n<p>10. Кто принимает бизнес-решение о допустимости вывода?  <\/p>\n<p><strong>Система/процессы заказчика, не Custody core.<\/strong><\/p>\n<h1>Что запомнить<\/h1>\n<p><strong>STRATO.Custody = адреса + blockchain processing + технический учёт + консолидация + вывод + распределённая подпись + интеграция с системами заказчика.<\/strong><\/p>\n<p>Базовый scope — USDT TRC-20.  <\/p>\n<p>Не продаём другие сети по факту наличия кода.  <\/p>\n<p>Не смешиваем технический и бухгалтерский учёт.  <\/p>\n<p>Не выдаём W-01…W-20 за уже принятые функции.  <\/p>\n<p>Не обещаем ключевую модель до ИБ/архитектурного обследования.<\/p>\n<h1>Источники<\/h1>\n<ul>\n<li><code>02.2 — STRATO.Custody — Sales Scope.md<\/code>;<\/li>\n<li><code>LedgerLab_Кастодиан_Технический_пакет.pdf<\/code>, версия 1.0 от 29.09.2026;<\/li>\n<li><code>LedgerLab — Кастодиан для банка<\/code>;<\/li>\n<li><code>02 — Карта знаний LedgerLab.md<\/code>.<\/li>\n<\/ul>"}];
let state={view:'login', current:null, admin:false, quizAnswer:'', quizDone:false, exam:false, product:'Exchange', attempts:3};
const app=document.getElementById('app');
function brandLogo(suffix=''){const cells=Array.from({length:16},(_,i)=>`<i></i>`).join('');return `<div class="brand"><span class="brand-mark" aria-hidden="true">${cells}</span><span><span class="brand-word">Леджер<span class="brand-dot">•</span>Лаб${suffix?` · ${suffix}`:''}</span><span class="brand-sub">MODULAR FINTECH SOFTWARE</span></span></div>`;}
function nav(admin=false){return `<div class="topbar">${brandLogo(admin?'ADMIN':'SALES ACADEMY')}<div class="nav">${admin?`<button onclick="go('admin')">Главная</button><button onclick="go('users')">Пользователи</button><button onclick="go('learn')">Просмотр курса</button><button onclick="go('dashboard')">Зона продавца</button>`:`<button onclick="go('dashboard')">Главная</button><button onclick="go('learn')">Обучение</button><button onclick="go('cert')">Сертификация</button><button onclick="go('profile')">Профиль</button><button onclick="go('admin')">Admin</button>`}</div></div>`}
function shell(body,admin=false){app.innerHTML=`<main class="shell">${nav(admin)}${body}</main>`;window.scrollTo(0,0)}
function go(v,slug=null){state.view=v;state.current=slug;state.quizDone=false;state.quizAnswer='';render()}
function login(){app.innerHTML=`<main class="shell login-wrap"><section class="card login-card">${brandLogo('SALES ACADEMY')}<h1>Sales Academy</h1><p class="muted">Обучение и сертификация продавцов</p><label>Email / логин<input class="field" value="seller@ledgerlab.demo"></label><label>Пароль<input class="field" type="password" value="prototype"></label><button class="button" style="width:100%" onclick="go('dashboard')">Войти</button><p class="brand-note">Технологии для финансового будущего</p><p class="muted">Демо-прототип: реальная авторизация пока не подключена.</p></section></main>`}

function learn(){shell(`<section class="hero"><div class="eyebrow">Обучение</div><h1>Модули курса</h1><p>Все опубликованные модули доступны сразу. Завершение — после мини-теста ≥ 80%.</p></section><div class="module-list">${MODULES.map((m,i)=>`<div class="module-row"><div><div class="eyebrow">${i<3?'Общий':'Продуктовый'} модуль</div><h3>${m.title}</h3><p>${i<2?'Завершён':i===2?'В процессе':'Не начат'}</p></div><div class="actions">${i<2?'<span class="badge ok">✓ завершён</span>':''}<button class="button secondary" onclick="go('module','${m.slug}')">${i===2?'Продолжить':'Открыть'}</button></div></div>`).join('')}</div>`)}
function moduleView(slug){const m=MODULES.find(x=>x.slug===slug);shell(`<section class="hero"><div class="eyebrow">Учебный модуль</div><h1>${m.title}</h1><p>Контент ниже загружен из рабочей Markdown-заметки Sales Academy.</p></section><div class="lesson-layout"><aside class="toc card"><div class="eyebrow">Навигация</div><p><button class="button secondary" onclick="go('learn')">← Все модули</button></p><p><button class="button" onclick="startQuiz(false,'${slug}')">Мини-тест →</button></p><p class="muted">В прототипе весь модуль показан как один читаемый документ.</p></aside><article class="markdown">${m.html}</article></div>`)}
function startQuiz(exam=false,product='Exchange'){state.exam=exam;state.product=product;state.quizAnswer='';state.quizDone=false;state.view='quiz';render()}
function selectAnswer(v){state.quizAnswer=v;render()}
function finishQuiz(){state.quizDone=true;render()} function retryQuiz(){state.quizDone=false;state.quizAnswer='';render()}
function quiz(){const correct=state.quizAnswer==='integrate';if(state.quizDone){const score=correct?(state.exam?85:100):75;shell(`<section class="result-card"><div class="score">${score}%</div><h2>${correct?(state.exam?'Экзамен сдан':'Тест сдан'):(state.exam?'Экзамен не сдан':'Тест не сдан')}</h2>${state.exam&&correct?`<div class="admitted">✓ Допущен к продажам STRATO.${state.product}</div>`:''}${!correct?'<p>Правильный ответ: <b>Integrate</b>. Новый внешний провайдер требует fit-gap и подтверждения интеграции.</p>':''}<div class="actions"><button class="button secondary" onclick="go('${state.exam?'cert':'learn'}')">Вернуться</button>${!correct?'<button class="button" onclick="retryQuiz()">Повторить</button>':''}</div></section>`);return}shell(`<section class="quiz"><div class="eyebrow">${state.exam?`Сертификационный экзамен · попытка 1 из 3`:'Мини-тест · вопрос 1 из 1'}</div><h2>Клиент просит подключить новый PSP, которого нет среди подтверждённых коннекторов. Как квалифицировать запрос?</h2>${[['ready','Ready'],['configure','Configure'],['integrate','Integrate'],['planned','Not planned']].map(x=>`<label class="option ${state.quizAnswer===x[0]?'selected':''}"><input type="radio" name="q" ${state.quizAnswer===x[0]?'checked':''} onchange="selectAnswer('${x[0]}')"> ${x[1]}</label>`).join('')}<button class="button" ${!state.quizAnswer?'disabled':''} onclick="finishQuiz()">Завершить</button></section>`)}
function cert(){shell(`<section class="hero"><div class="eyebrow">Сертификация</div><h1>Экзамены и допуски</h1><p>Общий экзамен независим от продуктовых. Для продуктового допуска нужны общие модули 1–3, продуктовый модуль и соответствующий экзамен.</p></section><div class="grid3"><div class="card"><div class="eyebrow">Общий экзамен</div><h2>База продаж</h2><p class="muted">Доступен · попытки 0/3</p><span class="badge">В прототипе позже</span></div><div class="card"><div class="eyebrow">STRATO.Exchange</div><h2>Экзамен доступен</h2><p class="muted">Модули 1–3 ✓ · Exchange ✓ · попытки 0/3</p><button class="button" onclick="startQuiz(true,'Exchange')">Начать</button></div><div class="card"><div class="eyebrow">STRATO.Custody</div><h2>Экзамен доступен</h2><p class="muted">Модули 1–3 ✓ · Custody ✓ · попытки 0/3</p><button class="button" onclick="startQuiz(true,'Custody')">Начать</button></div></div>`)}
function profile(){shell(`<section class="hero"><div class="eyebrow">Профиль</div><h1>Демо-продавец</h1><p>Course v1.0 · аккаунт активен</p></section><div class="grid"><div class="card"><h2>Обучение</h2><div class="kpi">60%</div><div class="progress"><i></i></div><p class="muted">Модули 1–2 завершены, модуль 3 в процессе.</p></div><div class="card"><h2>Допуски</h2><p>STRATO.Exchange <span class="badge">Экзамен доступен</span></p><p>STRATO.Custody <span class="badge">Экзамен доступен</span></p></div></div><h2 class="section-title">История экзаменов</h2><div class="card"><table class="table"><thead><tr><th>Экзамен</th><th>Результат</th><th>Дата</th><th>Версия</th></tr></thead><tbody><tr><td>—</td><td>Попыток пока нет</td><td>—</td><td>v1.0</td></tr></tbody></table></div>`)}
function admin(){shell(`<section class="hero"><div class="eyebrow">Admin Dashboard</div><h1>Операционная сводка</h1></section><div class="grid3"><div class="card"><div class="kpi">12</div><p class="muted">активных продавцов</p></div><div class="card"><div class="kpi">4</div><p class="muted">допущены Exchange</p></div><div class="card"><div class="kpi">3</div><p class="muted">допущены Custody</p></div></div><div class="actions"><button class="button" onclick="go('users')">Открыть пользователей</button></div>`,true)}
